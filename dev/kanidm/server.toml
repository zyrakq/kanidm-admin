# Dev-only Kanidm server config, baked into the dev image at
# /data/server.toml (the container-profile default config path).
# Keys are validated strictly (deny_unknown_fields), so keep this
# minimal and exact. LDAP stays disabled (ldapbindaddress unset).
# `origin` drives the generated certificate SAN; the app disables
# certificate verification entirely in container mode, so the SAN
# only matters for tools connecting from inside the container.
version = "2"
bindaddress = "0.0.0.0:8443"
db_path = "/data/kanidm.db"
tls_chain = "/data/cert.pem"
tls_key = "/data/key.pem"
domain = "localhost"
origin = "https://localhost:8443"
