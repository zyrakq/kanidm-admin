# Pipelight pipeline definitions (https://pipelight.dev).
# Lint without executing:  pipelight ls
# Run manually:            pipelight run docker-build
# The image name matches docker-compose.yml (`image: kanidm-admin`) so the
# local check builds exactly what `docker compose up -d` runs.
# The Dockerfile pins the production feature set itself
# (`--no-default-features --features customization`): customization stays,
# the dev-only testcontainer chain is compiled out — no build args needed
# here, the pipeline always checks the shipped image variant.

[[pipelines]]
name = "docker-build"

[[pipelines.steps]]
name = "build production image"
commands = ["docker build -t kanidm-admin:local ."]
