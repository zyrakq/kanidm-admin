[workspace]
members = ["app"]
# vendor/ holds nested external workspaces (kanidm); excluded so their
# `workspace = true` inheritance resolves against their own roots.
exclude = ["vendor"]
resolver = "2"

[workspace.dependencies]
axum = { version = "0.8", features = ["json"] }
tokio = { version = "1", features = ["full"] }
tower-http = { version = "0.6", features = ["fs", "cors"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tracing = "0.1"
env_logger = "0.11"
pretty_env_logger = "0.5"
dotenvy = "0.15"
config = { version = "0.15", features = ["toml"] }
rust-embed = { version = "8.4", default-features = false, features = ["mime-guess"] }
mime_guess = "2"
async-trait = "0.1"
base64 = "0.22"
kanidm_client = { path = "vendor/kanidm/libs/client" }
kanidm_proto = { path = "vendor/kanidm/proto" }
time = { version = "0.3", features = ["serde"] }
tower = { version = "0.5", features = ["util"] }
uuid = { version = "1", features = ["v4"] }