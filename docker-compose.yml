x-logging: &default-logging
  driver: "json-file"
  options:
    max-size: "${LOG_MAX_SIZE:-10m}"
    max-file: "${LOG_MAX_FILE:-3}"
    compress: "${LOG_COMPRESS:-true}"

services:
  kanidm-admin:
    container_name: kanidm-admin
    image: kanidm-admin
    build: .
    restart: unless-stopped
    logging: *default-logging
    ports:
      - 4000:4000
