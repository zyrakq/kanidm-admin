x-logging: &default-logging
  driver: "json-file"
  options:
    max-size: "${LOG_MAX_SIZE:-10m}"
    max-file: "${LOG_MAX_FILE:-3}"
    compress: "${LOG_COMPRESS:-true}"

services:
  kanidm-admin:
    container_name: kanidm-admin
    image: kanidm-admin
    build: .
    restart: unless-stopped
    logging: *default-logging
    ports:
      - 4000:4000
    volumes:
      - kanidm-admin-data:/workspace/app/traildepot/data
      - kanidm-admin-backups:/workspace/app/traildepot/backups
      - kanidm-admin-secrets:/workspace/app/traildepot/secrets
      - kanidm-admin-uploads:/workspace/app/traildepot/uploads

volumes:
  kanidm-admin-data:
    name: kanidm-admin-data
  kanidm-admin-backups:
    name: kanidm-admin-backups
  kanidm-admin-secrets:
    name: kanidm-admin-secrets
  kanidm-admin-uploads:
    name: kanidm-admin-uploads