[server]
address = "0.0.0.0:4000"

[frontend]
serve_from = "disk"
watch = false
public_dir = ""

[kanidm]
url = "https://localhost:8443"

[testcontainer]
mode = "auto"
network = "kanidm-admin-dev"

[testcontainer.kanidm]
enabled = false
image = "kanidm/server:1.11.2"

[testcontainer.kanidm_mail_sender]
enabled = false
image = "kanidm/tools:1.11.2"

[testcontainer.mailpit]
enabled = false
image = "axllent/mailpit:v1.31.2"
ui_port = 8025

[customization]
# Directory for uploaded customization overrides (logos, favicons and
# theme CSS). Empty means `<manifest_dir>/customization/`.
dir = ""
# Max upload size per slot; 512 KiB covers SVG/PNG images and CSS files.
max_size_bytes = 524288
# Standalone customization page (/design): mounts the management API
# (/api/customization*) and shows the footer "Design" link. Asset
# serving is always on. Default: true.
# Env override: APP_CUSTOMIZATION__PAGE__ENABLED
# page.enabled = false

[customization.theme]
# Deployment-default theme variant file names (file name only, no
# path — the `themes/light/` or `themes/dark/` subfolder of the
# customization dir is implied). Empty string means unset.
# Env overrides: APP_CUSTOMIZATION__THEME__LIGHT /
# APP_CUSTOMIZATION__THEME__DARK.
light = ""
dark = ""
