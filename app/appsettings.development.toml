[frontend]
serve_from = "disk"
watch = true

# Which dev containers to run is configured here; the whole chain
# is gated by the [testcontainer] enabled master switch below
# (settable per-run as APP_TESTCONTAINER__ENABLED).
[testcontainer]
enabled = true

[testcontainer.kanidm]
enabled = true

[testcontainer.kanidm_mail_sender]
enabled = true

[testcontainer.mailpit]
enabled = true
