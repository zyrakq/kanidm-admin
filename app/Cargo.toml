[package]
name = "kanidm-admin"
version = "1.0.1"
edition = "2021"
description = "A modern web-based administration console for Kanidm"
license = "MIT"
authors = ["Zyrakq <serg.shehov@tutanota.com>"]
repository = "https://github.com/zyrakq/kanidm-admin"
readme = "../README.md"

[dependencies]
axum = { workspace = true }
tokio = { workspace = true }
tower-http = { workspace = true }
tower = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
env_logger = { workspace = true }
pretty_env_logger = { workspace = true }
dotenvy = { workspace = true }
config = { workspace = true }
rust-embed = { workspace = true }
mime_guess = { workspace = true }
async-trait = { workspace = true }
base64 = { workspace = true }
kanidm_client = { workspace = true }
reqwest = { workspace = true }
kanidm_proto = { workspace = true }
time = { workspace = true }
testcontainers = { workspace = true, optional = true }
rcgen = { workspace = true, optional = true }
tokio-tungstenite = { workspace = true }
futures-util = { workspace = true }

[dev-dependencies]
http-body-util = "0.1"
indoc = "2"
tempfile = "3"
tower = { workspace = true }
uuid = { workspace = true }

[features]
default = ["customization", "testcontainer"]
# Theme variant storage/upload API (customization/ module). Pulls in
# axum's multipart feature, used only by customization/handlers.rs.
customization = ["axum/multipart"]
# Ephemeral dev container chain (testcontainer/ module): kanidm,
# mail sender, mailpit. Pulls in the container driver crates.
testcontainer = ["dep:testcontainers", "dep:rcgen"]
