# Release: build the production image, push it to ghcr.io, and create a
# GitHub Release with pull/run instructions.
#
# Triggers:
#  - pushing a tag `vX.Y.Z` (semver is derived from the tag name)
#  - manual dispatch with a `version` input (e.g. "0.2.0"); the release step
#    creates the `v<version>` tag if it does not exist yet.
#
# amd64 only for the first release (multi-arch deferred).
name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version without the v prefix (e.g. 0.2.0)'
        required: true
        type: string

permissions:
  contents: write   # create the GitHub Release (and tag on dispatch)
  packages: write   # push the image to ghcr.io

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Uniform version resolution for both triggers: dispatch input, or the
      # pushed tag with its `v` prefix stripped (vX.Y.Z -> X.Y.Z).
      - name: Resolve version
        id: ver
        run: |
          if [ -n "${{ inputs.version }}" ]; then
            echo "version=${{ inputs.version }}" >> "$GITHUB_OUTPUT"
          else
            echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Log in to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # If the build or push fails, the workflow aborts here — no release
      # is created for a broken image. Each variant is a separate build:
      # different CARGO_BUILD_FLAGS mean a different compiled dependency
      # set, so the three images cannot share one build.
      - name: Build and push image (default features)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/zyrakq/kanidm-admin:${{ steps.ver.outputs.version }}
            ghcr.io/zyrakq/kanidm-admin:latest

      - name: Build and push image (customization only)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          build-args: |
            CARGO_BUILD_FLAGS=--no-default-features --features customization
          tags: |
            ghcr.io/zyrakq/kanidm-admin:${{ steps.ver.outputs.version }}-customization
            ghcr.io/zyrakq/kanidm-admin:customization

      - name: Build and push image (minimal)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          build-args: |
            CARGO_BUILD_FLAGS=--no-default-features
          tags: |
            ghcr.io/zyrakq/kanidm-admin:${{ steps.ver.outputs.version }}-minimal
            ghcr.io/zyrakq/kanidm-admin:minimal

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.version }}
          generate_release_notes: true
          body: |
            ## Container image

            Package page: https://github.com/zyrakq/kanidm-admin/pkgs/container/kanidm-admin

            Every release ships **three image variants** — the same app and
            configuration, differing only in the compiled cargo feature set
            (selected via the `CARGO_BUILD_FLAGS` build arg in the Dockerfile).
            Pick the variant that matches your deployment; all of them are
            amd64 and configured identically.

            ### `vX.Y.Z` / `latest` — full build

            Compiled with the default features: `customization` **and**
            `testcontainer`. Same feature set as `docker compose up -d` and
            the host `cargo run` dev flow. The bundled dev container chain
            (ephemeral Kanidm, mail sender, Mailpit) can be driven from
            inside the container through a mounted Docker socket — useful
            for trying the app with a throwaway Kanidm. For plain
            production use behind an existing Kanidm this variant carries
            the dev-only container-driver crates for nothing.

            ### `vX.Y.Z-customization` / `customization` — recommended for production

            Compiled with `--no-default-features --features customization`:
            the theme variant storage/upload API stays in, while the
            container-driver crates (`testcontainers`, `rcgen`) are
            compiled out — smaller binary, smaller dependency graph, and
            the image never needs a Docker socket.

            ### `vX.Y.Z-minimal` / `minimal` — bare console

            Compiled with `--no-default-features`: every optional subsystem
            is compiled out. Core admin console only (persons, groups,
            service accounts, OAuth2, …) with no theme variant API and no
            dev container chain. Smallest binary; pick it when you do not
            need customization at all.

            ### Pull

            ```bash
            docker pull ghcr.io/zyrakq/kanidm-admin:v${{ steps.ver.outputs.version }}
            docker pull ghcr.io/zyrakq/kanidm-admin:v${{ steps.ver.outputs.version }}-customization
            docker pull ghcr.io/zyrakq/kanidm-admin:v${{ steps.ver.outputs.version }}-minimal
            ```

            ## Run

            ```bash
            docker run -d -p 4000:4000 ghcr.io/zyrakq/kanidm-admin:v${{ steps.ver.outputs.version }}
            ```

            The image ships with the baked-in default configuration
            (`kanidm.url = "https://localhost:8443"`). There is **no env-var
            override** — point it at your Kanidm instance by mounting a TOML
            overlay into `/workspace/app`:

            ```bash
            docker run -d -p 4000:4000 \
              -v /path/to/appsettings.production.toml:/workspace/app/appsettings.production.toml:ro \
              ghcr.io/zyrakq/kanidm-admin:v${{ steps.ver.outputs.version }}
            ```
